<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Good Fellas | 지원 요청 예측기</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%236366f1%22/></svg>">

  <!-- Theme Initialization (Zero FOUC) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cr_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'light' || (!saved && !prefersDark)) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              base: '#0b0d13',
              surface: '#11141e',
              elevated: '#1a202c'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=1.1.0" />
</head>
<body class="bg-[#090b10] text-slate-100 min-h-screen">

  <div class="max-w-md mx-auto px-3.5 py-4">

    <!-- 1. 초경량 미니멀 헤더 -->
    <header class="flex items-center justify-between pb-3 border-b border-white/[0.06]">
      <div>
        <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
          <span>지원 요청 예측 순서</span>
          <span class="text-[10px] font-mono text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/20">Good Fellas</span>
        </h1>
        <p class="text-[10px] text-slate-400 mt-0.5">
          지금 요청 가능 및 쿨다운 종료 임박 순 정렬
        </p>
      </div>

      <!-- 실시간 상태 점 & 수동 새로고침 -->
      <div class="flex items-center gap-1.5 text-[11px] text-slate-400">
        <span id="db-status-badge" class="status-dot green live-pulse" title="Google Drive DB 자동 동기화 활성"></span>
        <button type="button" onclick="window.donateApp.fetchAndRender(true)" class="p-1.5 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] text-slate-400 hover:text-white transition" title="새로고침">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <!-- 2. 요약 카운터 & 심플 검색 -->
    <div class="my-3 flex items-center justify-between gap-2 text-xs">
      <div class="text-slate-400 font-medium text-[11px]">
        <span class="text-emerald-400 font-bold" id="count-ready">0</span>명 요청 가능 · <span class="text-amber-400 font-bold" id="count-cooldown">0</span>명 쿨다운
      </div>
      <div class="relative w-36 sm:w-44">
        <i data-lucide="search" class="w-3 h-3 text-slate-500 absolute left-2.5 top-2.5 pointer-events-none"></i>
        <input type="text" id="search-input" placeholder="이름/태그 검색..." class="w-full pl-7 pr-2 py-1.5 rounded-lg bg-white/[0.04] border border-white/[0.08] text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition" />
      </div>
    </div>

    <!-- 3. 클랜원 지원 요청 예측 리스트 (요청할 때가 된 순서대로) -->
    <main>
      <div id="member-donate-list" class="space-y-1.5">
        <!-- JavaScript 동적 생성 -->
      </div>
      <div id="empty-state" class="hidden py-12 text-center text-xs text-slate-500">
        검색 결과와 일치하는 클랜원이 없습니다.
      </div>
    </main>

  </div>

  <!-- 4. 유저별 세부 지원 이력 모달 (클랜원 이름 클릭 시) -->
  <div id="user-history-modal" class="modal-overlay fixed inset-0 z-40 flex items-center justify-center p-4" aria-hidden="true">
    <div class="modal-panel donate-modal-card w-[360px] max-w-[calc(100vw-32px)] rounded-2xl p-5 border border-white/[0.1] shadow-2xl relative flex flex-col max-h-[85vh]">
      <div class="flex items-start justify-between pb-3 border-b border-white/[0.08] shrink-0">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h3 id="hist-member-name" class="text-base font-bold text-white truncate">클랜원</h3>
            <span id="hist-member-role" class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/[0.06] text-slate-300">멤버</span>
          </div>
          <p id="hist-member-tag" class="text-xs font-mono text-slate-400 mt-0.5">#TAG</p>
        </div>
        <button type="button" onclick="window.donateApp.closeHistoryModal()" class="p-1.5 rounded-lg bg-white/[0.04] hover:bg-white/[0.1] text-slate-400 hover:text-white transition">✕</button>
      </div>

      <div class="my-3 space-y-2 text-xs overflow-y-auto flex-1 overscroll-contain pr-1">
        <!-- 예측 분석 요약 -->
        <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.06] space-y-1">
          <div class="text-[11px] font-semibold text-indigo-300 flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3 h-3 text-indigo-400"></i>
            <span>루틴 분석 (Drive DB 학습)</span>
          </div>
          <div class="grid grid-cols-2 gap-2 text-[11px] pt-1">
            <div>
              <span class="text-slate-400">주 요청 시간대:</span>
              <div id="hist-peak-hours" class="font-semibold text-white mt-0.5">분석 중</div>
            </div>
            <div>
              <span class="text-slate-400">평균 주기:</span>
              <div id="hist-avg-interval" class="font-semibold text-white mt-0.5">7시간 15분</div>
            </div>
          </div>
        </div>

        <!-- 최근 이력 -->
        <div>
          <div class="text-[11px] font-bold text-slate-300 mb-1.5 flex items-center justify-between">
            <span>최근 지원 요청 이력</span>
            <span id="hist-total-count" class="text-[10px] text-slate-500 font-mono">총 0건</span>
          </div>
          <div id="hist-timeline-list" class="space-y-1.5">
            <!-- 동적 삽입 -->
          </div>
        </div>
      </div>

      <div class="pt-2 border-t border-white/[0.06] shrink-0">
        <button type="button" onclick="window.donateApp.closeHistoryModal()" class="w-full py-2.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.12] text-xs font-semibold text-slate-200 transition">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 토스트 컨테이너 -->
  <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-max max-w-[90vw]"></div>

  <!-- Scripts -->
  <script src="js/api.js?v=1.1.0"></script>
  <script src="js/app.js?v=1.1.0"></script>
</body>
</html>
