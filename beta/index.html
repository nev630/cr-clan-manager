<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https://api-assets.clashroyale.com; connect-src 'self' https://green-disk-88a6.marble593812345.workers.dev https://api.clashroyale.com https://proxy.royaleapi.dev https://corsproxy.io https://api.allorigins.win;" />
  <title>Good Fellas | 클랜 관리 대시보드</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233b82f6%22/></svg>">

  <!-- Theme Initialization (Zero FOUC) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cr_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'light' || (!saved && !prefersDark)) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              base: '#0c0e12',
              surface: '#14171f',
              elevated: '#1d222e'
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=2.0.0" />
</head>
<body class="bg-[#0c0e12] text-slate-100 min-h-screen antialiased selection:bg-blue-500/25 selection:text-blue-200">

  <!-- 슬림 1줄 Floating Bar: 클랜명 + 태그 + 테마 토글 -->
  <header id="floating-topbar" class="floating-topbar">
    <div class="flex items-center justify-between gap-2 h-full">
      <div class="flex items-center gap-2 min-w-0">
        <h1 class="text-sm font-bold tracking-tight text-white whitespace-nowrap" id="clan-name">Good Fellas</h1>
        <span class="text-[11px] font-mono text-slate-400 whitespace-nowrap" id="clan-tag">#G890J9JC</span>
      </div>

      <button id="btn-theme-toggle" class="w-8 h-8 rounded-full hover:bg-white/[0.06] text-slate-300 hover:text-white transition-colors flex items-center justify-center relative overflow-hidden select-none shrink-0" title="다크 / 라이트 모드 전환" aria-label="테마 전환">
        <div id="theme-toggle-icon" class="relative w-4 h-4 flex items-center justify-center pointer-events-none">
          <svg id="icon-sun" class="w-4 h-4 text-slate-700 absolute pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg id="icon-moon" class="w-4 h-4 text-slate-200 absolute pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </div>
      </button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <div class="dashboard-main-wrapper max-w-md mx-auto px-3.5 pb-6">

    <!-- 상단 본문 내비게이션 탭 (고정 해제, 스크롤 흐름 배치) -->
    <nav class="mb-3.5" aria-label="메인 뷰 전환">
      <div class="segmented-control relative grid grid-cols-2 p-1 rounded-xl bg-[#14171f] border border-white/[0.07] w-full overflow-hidden">
        <div id="main-tab-pill" class="segmented-pill main-pill"></div>

        <button id="tab-btn-dashboard" class="main-nav-btn active relative z-10 justify-center whitespace-nowrap py-1.5 text-center text-xs" onclick="window.app.switchMainTab('dashboard')">
          <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
          <span>내 클랜 대시보드</span>
        </button>
        <button id="tab-btn-compare" class="main-nav-btn relative z-10 justify-center whitespace-nowrap py-1.5 text-center text-xs" onclick="window.app.switchMainTab('compare')">
          <i data-lucide="scale" class="w-3.5 h-3.5"></i>
          <span>타 갤클과 비교</span>
        </button>
      </div>
    </nav>

    <!-- ========================================== -->
    <!-- VIEW A: 내 클랜 대시보드 (Good Fellas 전용) -->
    <!-- ========================================== -->
    <div id="view-dashboard" class="tab-view block space-y-3.5">

      <!-- 핵심 3대 지표 스트립 -->
      <section class="grid grid-cols-3 gap-2">
        <div class="surface-card p-3">
          <div class="text-[10px] font-medium text-slate-400 tracking-wider">전체 클랜원</div>
          <div class="text-lg font-bold text-white mt-0.5 tabular-nums" id="stat-total-members">
            <span class="skeleton-block inline-block w-14 h-5 rounded"></span>
          </div>
          <div class="text-[10px] text-slate-400 mt-0.5 truncate" id="stat-member-vacant">집계 중...</div>
        </div>

        <div class="surface-card p-3">
          <div class="text-[10px] font-medium text-slate-400 tracking-wider">주간 총 지원량</div>
          <div class="text-lg font-bold text-blue-400 mt-0.5 tabular-nums" id="stat-total-donations">
            <span class="skeleton-block inline-block w-14 h-5 rounded"></span>
          </div>
          <div class="text-[10px] text-slate-400 mt-0.5 truncate" id="stat-avg-donations">계산 중...</div>
        </div>

        <button type="button" class="surface-card p-3 text-left cursor-pointer hover:border-rose-500/40 transition-colors group" onclick="window.app.openDormantModal()">
          <div class="text-[10px] font-medium text-slate-400 group-hover:text-rose-400 tracking-wider">3일+ 미접속</div>
          <div class="text-lg font-bold text-rose-400 mt-0.5 tabular-nums" id="stat-dormant-count">
            <span class="skeleton-block inline-block w-10 h-5 rounded"></span>
          </div>
          <div class="text-[10px] text-slate-400 group-hover:text-rose-400 mt-0.5 truncate">목록 보기 ↗</div>
        </button>
      </section>

      <!-- 시각화 세션: 주간 지원 Top 7 & 접속 분포 도넛 -->
      <section class="grid grid-cols-1 gap-3">
        <div class="surface-card p-3.5 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-slate-200">주간 지원 기여도 Top 7</span>
          </div>

          <!-- 3인 포디움 -->
          <div id="podium-container" class="flex items-end justify-center gap-2 pt-4 pb-0 px-1 min-h-[140px]">
            <div class="flex-1 max-w-[130px] flex flex-col items-center gap-2">
              <div class="skeleton-block w-16 h-6 rounded"></div>
              <div class="skeleton-block w-full h-20 rounded-t-lg"></div>
            </div>
            <div class="flex-1 max-w-[145px] flex flex-col items-center gap-2">
              <div class="skeleton-block w-20 h-7 rounded"></div>
              <div class="skeleton-block w-full h-28 rounded-t-lg"></div>
            </div>
            <div class="flex-1 max-w-[130px] flex flex-col items-center gap-2">
              <div class="skeleton-block w-16 h-6 rounded"></div>
              <div class="skeleton-block w-full h-14 rounded-t-lg"></div>
            </div>
          </div>

          <!-- 4위 ~ 7위 러너 리스트 -->
          <div id="podium-runners-container" class="grid grid-cols-2 gap-1.5 pt-3 mt-3 border-t border-white/[0.06]">
            <div class="skeleton-block h-7 rounded"></div>
            <div class="skeleton-block h-7 rounded"></div>
            <div class="skeleton-block h-7 rounded"></div>
            <div class="skeleton-block h-7 rounded"></div>
          </div>
        </div>

        <!-- 접속 상태 분포 도넛 -->
        <div class="surface-card p-3.5">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-slate-200">클랜원 접속 분포</span>
          </div>
          <div class="chart-container-donut">
            <canvas id="chart-activity"></canvas>
          </div>
        </div>
      </section>

      <!-- 컨트롤 바: 필터 칩 & 검색 & 정렬 -->
      <section class="flex flex-col justify-between gap-2">
        <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 scrollbar-none">
          <button class="filter-chip active text-xs" data-filter="all" onclick="window.app.setFilterTab('all', this)">
            전체 <span class="text-slate-400 ml-1 font-mono text-[11px] tabular-nums" id="chip-count-all">-</span>
          </button>
          <button class="filter-chip text-xs" data-filter="low-donations" onclick="window.app.setFilterTab('low-donations', this)">
            지원 저조 (50 미만) <span class="text-slate-400 ml-1 font-mono text-[11px] tabular-nums" id="chip-count-low">-</span>
          </button>
        </div>

        <div class="flex items-center gap-1.5">
          <div class="relative flex-1">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" id="search-input" placeholder="닉네임 또는 #태그 검색..."
              class="w-full pl-8 pr-7 py-1.5 bg-[#14171f] border border-white/[0.07] rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500/60 transition-colors" />
            <button type="button" id="btn-search-clear" onclick="window.app.clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-white/[0.08] hover:bg-white/[0.15] text-slate-400 hover:text-white items-center justify-center text-[10px] leading-none transition-colors" title="검색어 지우기" aria-label="검색어 지우기">✕</button>
          </div>

          <select id="sort-key-select" class="bg-[#14171f] border border-white/[0.07] rounded-lg px-2 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-blue-500/60 cursor-pointer shrink-0">
            <option value="lastSeen" selected>마지막 접속</option>
            <option value="donations">지원량</option>
            <option value="lastBattle">마지막 배틀</option>
            <option value="trophies">트로피</option>
          </select>

          <button id="btn-sort-order" type="button" class="flex items-center gap-1.5 bg-[#14171f] hover:bg-[#1d222e] border border-white/[0.07] rounded-lg px-2.5 py-1.5 text-xs text-slate-300 transition-colors shrink-0 select-none" title="정렬 순서 변경">
            <span id="sort-order-icon-wrapper" class="inline-flex items-center justify-center transition-transform duration-200 ease-out origin-center">
              <i data-lucide="arrow-down-wide-narrow" class="w-3.5 h-3.5 text-blue-400" id="sort-order-icon"></i>
            </span>
            <span id="sort-order-text">내림차순</span>
          </button>
        </div>
      </section>

      <!-- 클랜원 목록 (탭 시 RoyaleAPI 즉시 새 창 이동) -->
      <div class="surface-card overflow-hidden">
        <div class="block divide-y divide-white/[0.05]" id="member-mobile-list">
          <!-- 초기 스켈레톤 로딩 -->
          <div class="p-3.5 space-y-2.5">
            <div class="flex justify-between"><span class="skeleton-block w-28 h-4 rounded"></span><span class="skeleton-block w-14 h-4 rounded"></span></div>
            <div class="grid grid-cols-3 gap-2 pt-2"><span class="skeleton-block h-7 rounded"></span><span class="skeleton-block h-7 rounded"></span><span class="skeleton-block h-7 rounded"></span></div>
          </div>
          <div class="p-3.5 space-y-2.5">
            <div class="flex justify-between"><span class="skeleton-block w-32 h-4 rounded"></span><span class="skeleton-block w-14 h-4 rounded"></span></div>
            <div class="grid grid-cols-3 gap-2 pt-2"><span class="skeleton-block h-7 rounded"></span><span class="skeleton-block h-7 rounded"></span><span class="skeleton-block h-7 rounded"></span></div>
          </div>
          <div class="p-3.5 space-y-2.5">
            <div class="flex justify-between"><span class="skeleton-block w-24 h-4 rounded"></span><span class="skeleton-block w-14 h-4 rounded"></span></div>
            <div class="grid grid-cols-3 gap-2 pt-2"><span class="skeleton-block h-7 rounded"></span><span class="skeleton-block h-7 rounded"></span><span class="skeleton-block h-7 rounded"></span></div>
          </div>
        </div>

        <!-- 빈 검색/필터 결과 안내 -->
        <div id="empty-state" class="hidden py-12 px-4 text-center text-slate-500">
          <p class="text-xs font-medium text-slate-400">일치하는 클랜원이 없습니다.</p>
          <p class="text-[11px] text-slate-500 mt-1">검색어나 필터 조건을 변경해 보세요.</p>
          <button type="button" onclick="window.app.resetFiltersAndSearch()" class="mt-3 px-3 py-1.5 rounded-lg bg-[#1d222e] hover:bg-white/[0.1] text-slate-200 border border-white/[0.08] text-xs font-semibold transition-colors inline-flex items-center gap-1.5">
            <span>필터 및 검색 초기화</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW B: 타 갤클과 비교 (총 지원량 / 1인 평균 비교 탭) -->
    <!-- ========================================== -->
    <div id="view-compare" class="tab-view hidden space-y-3.5">

      <!-- 비교 상단 헤더 및 지표 전환 칩 -->
      <div class="flex flex-col gap-2.5">
        <div>
          <h2 class="text-sm font-bold text-white tracking-tight">갤러리 클랜 활동성 및 규모 비교</h2>
          <p class="text-[11px] text-slate-400 mt-0.5 whitespace-nowrap">
            <span class="text-blue-400 font-semibold">Good Fellas</span> vs <span class="text-slate-300 font-medium">Vandros</span> vs <span class="text-slate-300 font-medium">딜넣는 도둑</span>
          </p>
        </div>

        <div id="compare-metric-tabs" class="segmented-control relative grid grid-cols-2 p-1 rounded-xl bg-[#14171f] border border-white/[0.07] overflow-hidden">
          <div id="compare-tab-pill" class="segmented-pill compare-pill"></div>
          <button type="button" class="compare-metric-chip active relative z-10" data-metric="donationsWeekly" onclick="window.app.switchCompareMetric('donationsWeekly', this)">총 지원량</button>
          <button type="button" class="compare-metric-chip relative z-10" data-metric="donationsAvg" onclick="window.app.switchCompareMetric('donationsAvg', this)">1인 평균</button>
        </div>
      </div>

      <!-- 상단 차트 + 하단 핵심 현황 -->
      <div class="grid grid-cols-1 gap-3.5 items-stretch">
        <section class="surface-card p-3.5 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-2 shrink-0">
            <span class="text-xs font-semibold text-slate-200" id="compare-chart-title">주간 총 지원량 비교</span>
          </div>
          <div class="chart-container-compare relative" id="compare-chart-container">
            <div id="compare-bars-stage" class="w-full h-full relative"></div>
          </div>
        </section>

        <section class="surface-card overflow-hidden flex flex-col justify-between">
          <div class="p-3.5 border-b border-white/[0.06] flex items-center justify-between shrink-0">
            <h3 class="text-xs font-semibold text-white" id="compare-list-title">클랜별 핵심 현황 및 지원량 격차</h3>
          </div>

          <div class="divide-y divide-white/[0.05] flex-1 flex flex-col justify-around" id="compare-summary-list">
            <!-- JavaScript 동적 렌더링 -->
          </div>
        </section>
      </div>

    </div>

  </div>

  <!-- 3일+ 미접속 대상자 전용 팝업 모달 -->
  <div id="dormant-members-modal" class="modal-overlay fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/60 px-3 pb-3 sm:p-4" aria-hidden="true" onclick="if(event.target === this) window.app.closeDormantModal()">
    <div class="modal-panel surface-card w-full max-w-sm rounded-2xl overflow-hidden border border-white/[0.1] flex flex-col max-h-[80vh]">
      <div class="p-4 border-b border-white/[0.06] flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2">
          <span class="status-dot rose"></span>
          <h3 class="text-sm font-bold text-white tracking-tight">3일+ 미접속 대상자</h3>
          <span id="dormant-modal-count" class="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded bg-rose-500/15 text-rose-400">0명</span>
        </div>
        <button type="button" onclick="window.app.closeDormantModal()" class="p-1.5 rounded-lg hover:bg-white/[0.08] text-slate-400 hover:text-white transition-colors" aria-label="닫기">✕</button>
      </div>

      <div id="dormant-modal-list" class="divide-y divide-white/[0.05] overflow-y-auto flex-1 overscroll-contain">
        <!-- JavaScript 동적 렌더링 -->
      </div>

      <div class="p-3 border-t border-white/[0.06] shrink-0">
        <button type="button" onclick="window.app.closeDormantModal()" class="w-full py-2 rounded-xl bg-[#1d222e] hover:bg-white/[0.1] text-xs font-semibold text-slate-200 transition-colors">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 동기화 실패 에러 알림 팝업 모달 -->
  <div id="sync-error-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/65 px-4" aria-hidden="true">
    <div class="modal-panel surface-card p-5 rounded-2xl max-w-xs w-full mx-4 text-center border border-rose-500/30">
      <div class="w-10 h-10 rounded-full bg-rose-500/10 flex items-center justify-center mx-auto mb-3 text-rose-400">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h3 id="error-modal-title" class="text-sm font-bold text-white tracking-tight">데이터 동기화 실패</h3>
      <p id="error-modal-message" class="text-xs text-slate-400 mt-1.5 leading-relaxed bg-[#0c0e12] p-3 rounded-xl text-left">
        서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.
      </p>
      <div class="flex items-center justify-end gap-2 mt-4">
        <button id="btn-error-close" type="button" class="flex-1 py-2 text-xs bg-[#1d222e] hover:bg-white/[0.1] text-slate-300 rounded-xl transition-colors font-medium">
          닫기
        </button>
        <button id="btn-error-retry" type="button" class="flex-1 py-2 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-colors font-medium flex items-center justify-center gap-1">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          <span>다시 시도</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 플로팅 토스트 컨테이너 -->
  <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-max max-w-[90vw]"></div>

  <!-- Scripts -->
  <script src="js/api.js?v=2.0.0"></script>
  <script src="js/app.js?v=2.0.0"></script>
</body>
</html>
